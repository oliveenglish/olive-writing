<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F2A3D">
<meta name="robots" content="noindex">
<title>Monster Writing · 올리브 브릿지 라이팅</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Nunito:wght@700;800;900&display=swap">
<style>
/* 브릿지 라이팅과 같은 색: 네이비 #0F2A3D · 틸 #1E8C77 · 민트 #4CC3A8 · 배경 #F3F6F5 */
:root{--bg:#f3f6f5;--line:#e1e8e6;--line2:#d3dcda;--ink:#13283a;--muted:#5a6d7c;--teal:#1e8c77;--teal2:#0e6b5c;--mint:#4cc3a8;--tint:#ddf1eb;--soft:#eef2f1;--dim:#a9b8b4;--navy:#0f2a3d;--warn:#b4541a;--warnbg:#fff1e6;--warnink:#8a3a0e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
button{font:inherit}
.en{font-family:Nunito,"Noto Sans KR",sans-serif}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
@media(min-width:900px){.app{max-width:760px}.hero{border-radius:0 0 22px 22px}}
.hero{background:var(--navy);color:#fff;padding:20px 20px 18px;display:flex;flex-direction:column;gap:8px}
.kick{font-size:12px;font-weight:800;letter-spacing:2px;color:#9fd9cc}
.hero h1{margin:0;color:#fff;font-size:23px;font-weight:900;line-height:1.3}
.hero .sub{font-size:13px;color:#d6e3ec}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--mint);transition:width .3s}
.main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.label{font-size:12px;font-weight:800;color:var(--muted)}
.small{font-size:13px}.muted{color:var(--muted)}
.title{font-size:24px;font-weight:900}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;border:none;background:var(--teal);color:#fff;font-size:17px;font-weight:800;cursor:pointer;width:100%}
.btn:disabled{background:var(--dim);cursor:default}
.btn.ghost{background:#fff;color:var(--teal2);border:2px solid var(--line2)}
.step{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px;border:2px solid transparent;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.step.next{border-color:var(--teal)}
.step.done{opacity:.8}
.num{width:30px;height:30px;flex:none;border-radius:999px;border:2px solid var(--dim);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
.step.done .num{background:var(--teal);border-color:var(--teal);color:#fff}
.step.next .num{border-color:var(--teal);color:var(--teal)}
.step .tt{display:block;font-size:16px;font-weight:800}
.step .nn{display:block;font-size:13px;color:var(--muted)}
.go{margin-left:auto;font-size:13px;font-weight:800;color:#fff;background:var(--teal);border-radius:99px;padding:8px 14px;white-space:nowrap}
.go.ghost{background:#fff;color:var(--teal2);border:2px solid var(--line2)}
.pbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:999px;background:var(--teal)}
.qcard{background:#fff;border-radius:22px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.flip{border:none;cursor:pointer;min-height:340px;box-shadow:0 6px 24px rgba(15,42,61,.10);color:inherit;width:100%;justify-content:center}
.speak{width:54px;height:54px;border-radius:999px;border:none;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{min-height:60px;border-radius:16px;border:2px solid var(--line2);background:#fff;font-size:18px;font-weight:800;color:var(--ink);cursor:pointer;padding:8px 16px;text-align:left;width:100%}
.choice.right{background:var(--tint);border:3px solid var(--teal);color:var(--teal2)}
.choice.wrong{background:var(--warnbg);border-color:var(--warn);color:var(--warnink)}
.choice:disabled{cursor:default}
.tray{min-height:110px;border-radius:18px;border:2px dashed var(--dim);background:#fff;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.chunks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chunk{min-height:50px;border-radius:14px;border:2px solid var(--line2);background:var(--tint);padding:0 14px;font-family:Nunito,sans-serif;font-size:19px;font-weight:900;color:var(--ink);cursor:pointer}
.chunk.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chunk.used{background:transparent;border-style:dashed;border-color:var(--line);color:var(--line2);cursor:default}
.bubble{padding:12px 14px;border-radius:14px;font-size:15px;font-weight:700}
.bubble.ok{background:var(--tint);color:var(--teal2)}
.bubble.no{background:var(--warnbg);color:var(--warnink)}
.hint{background:#fff;border:2px solid var(--line2);color:var(--teal2);border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer}
.res{border:3px solid var(--teal);border-radius:22px;background:#fff;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.res .line{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:12px 14px;font-weight:800}
.res .line b{color:var(--teal2);font-family:Nunito,sans-serif;font-size:18px}
.stamp{align-self:center;background:var(--teal);color:#fff;border-radius:99px;padding:6px 16px;font-weight:900;font-size:14px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.units a{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.units a b{font-size:15px}.units a span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="kick">MONSTER WRITING 3.2</div>
    <h1 id="h1"></h1>
    <div class="sub" id="sub"></div>
    <div class="bar"><span id="bar" style="width:0"></span></div>
  </header>
  <main class="main" id="main"></main>
</div>

const $main = document.getElementById("main");
const unit = parseInt(new URLSearchParams(location.search).get("unit"), 10);
const U = DATA[unit];
const pad = (n) => String(n).padStart(2, "0");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const shuffleNotSame = (a) => { if (a.length < 2) return [...a]; for (let k = 0; k < 6; k++) { const b = shuffle(a); if (b.some((x, i) => x !== a[i])) return b; } return [...a].reverse(); };
const SPK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';

function say(t, rate) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g, ""));
  u.lang = "en-US"; u.rate = rate || 0.9;
  speechSynthesis.speak(u);
}

/* 기록 (이 기기에만 저장) */
const KEY = "monster-3.2-unit-" + unit;
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function save(rec) { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch {} }

const ACTS = [
  { key: "flash", name: "단어 플래시 카드", desc: () => `단어 ${U.w.length}개 · 카드를 눌러 뜻 확인` },
  { key: "meaning", name: "뜻 고르기", desc: () => `단어 ${U.w.length}개 · 알맞은 뜻 고르기` },
  { key: "chunk", name: "문장 만들기", desc: () => `문장 ${U.s.length}개 · 덩어리를 눌러 문장 완성` },
];

function header(sub) {
  document.getElementById("h1").textContent = `Unit ${pad(unit)} · ${U.t}`;
  document.getElementById("sub").textContent = sub;
  const rec = load();
  const n = ACTS.filter((a) => rec[a.key]).length;
  document.getElementById("bar").style.width = Math.round((n / ACTS.length) * 100) + "%";
}

/* 유닛 주소가 없을 때: 쌤용 유닛 목록 */
function unitList() {
  document.getElementById("h1").textContent = "유닛을 골라요";
  document.getElementById("sub").textContent = "과제에는 각 유닛 주소를 붙여 넣어요 (예: monster.html?unit=1)";
  document.getElementById("bar").parentElement.style.display = "none";
  $main.innerHTML = `<div class="units">${Object.keys(DATA).map((k) => `<a href="?unit=${k}"><b>Unit ${pad(k)}</b><span>${esc(DATA[k].t)}</span></a>`).join("")}</div>`;
}

function home() {
  speechSynthesis && speechSynthesis.cancel();
  const rec = load();
  header("순서대로 세 가지를 끝내고, 마지막 화면을 캡처해서 Sookje에 올려요");
  const nextIdx = ACTS.findIndex((a) => !rec[a.key]);
  $main.innerHTML = ACTS.map((a, i) => {
    const r = rec[a.key];
    const cls = r ? "done" : i === nextIdx ? "next" : "";
    const status = r ? (a.key === "flash" ? "완료" : `완료 · 한 번에 맞힘 ${r.score}/${r.total}`) : a.desc();
    return `<button class="step ${cls}" data-k="${a.key}"><span class="num">${r ? "✓" : i + 1}</span><span><span class="tt">${a.name}</span><span class="nn">${status}</span></span><span class="go ${r ? "ghost" : ""}">${r ? "다시 하기" : "시작"}</span></button>`;
  }).join("") + (nextIdx === -1
    ? `<button class="btn" id="toRes">결과 화면 보기</button>`
    : `<div class="card small muted">세 가지를 다 하면 캡처할 결과 화면이 나와요. 다 하고 나면 문제집을 풀어요.</div>`);
  $main.querySelectorAll(".step").forEach((b) => b.onclick = () => start(b.dataset.k));
  const r = document.getElementById("toRes"); if (r) r.onclick = result;
  scrollTo(0, 0);
}

function start(k) { ({ flash, meaning, chunk })[k](); }

function finish(k, score, total) {
  const rec = load();
  rec[k] = { score, total, at: new Date().toISOString() };
  save(rec);
  if (ACTS.every((a) => rec[a.key])) result(); else home();
}

function progress(n, total, label) {
  return `<div class="col" style="gap:6px"><div class="row" style="justify-content:space-between"><span class="label">${label}</span><b class="small" style="color:var(--teal)">${n} / ${total}</b></div><div class="pbar"><span style="width:${Math.round(n / total * 100)}%"></span></div></div>`;
}
const backBtn = `<button class="btn ghost" id="back">처음 화면으로</button>`;
function wireBack() { document.getElementById("back").onclick = home; }

/* ① 플래시 카드: 모르는 단어는 끝에 한 번 더 */
function flash() {
  header("① 단어 플래시 카드");
  let queue = U.w.map(([w, m]) => ({ w, m })), again = new Set(), known = 0, back = false;
  const draw = () => {
    const c = queue[0];
    $main.innerHTML = progress(known, U.w.length, "① 플래시 카드 · 카드를 누르면 뒤집혀요") +
      `<button class="qcard flip" id="card"><div class="en" style="font-size:44px;font-weight:900;line-height:1.15">${esc(c.w)}</div>
        <span class="speak" id="spk">${SPK}</span>
        ${back ? `<div style="width:100%;border-top:2px dashed var(--line);margin:6px 0"></div><div style="font-size:26px;font-weight:900">${esc(c.m)}</div>` : `<div class="small muted" style="margin-top:16px">뜻이 생각나면 카드를 눌러 확인해요</div>`}
      </button>
      <div class="grid2"><button class="btn ghost" id="no">한 번 더 볼래요</button><button class="btn" id="ok">알아요</button></div>` + backBtn;
    document.getElementById("card").onclick = () => { back = !back; draw(); };
    document.getElementById("spk").onclick = (e) => { e.stopPropagation(); say(c.w); };
    document.getElementById("ok").onclick = () => next(true);
    document.getElementById("no").onclick = () => next(false);
    wireBack();
  };
  const next = (ok) => {
    const c = queue.shift();
    if (!ok && !again.has(c.w)) { queue.push(c); again.add(c.w); } else known++;
    back = false;
    if (!queue.length) return finish("flash", U.w.length, U.w.length);
    draw(); say(queue[0].w);
  };
  draw(); say(queue[0].w);
}

/* ② 뜻 고르기: 틀린 단어는 끝에 한 번 더 · 점수는 한 번에 맞힌 것 */
function meaning() {
  header("② 뜻 고르기");
  const all = U.w.map(([, m]) => m);
  let queue = shuffle(U.w.map(([w, m]) => ({ w, m }))), retried = new Set(), score = 0, doneN = 0;
  const draw = () => {
    const c = queue[0];
    const opts = shuffle([c.m, ...shuffle(all.filter((x) => x !== c.m)).slice(0, 3)]);
    $main.innerHTML = progress(doneN, U.w.length, "② 뜻 고르기 · 단어를 듣고 알맞은 뜻") +
      `<div class="qcard"><div class="en" style="font-size:42px;font-weight:900">${esc(c.w)}</div><button class="speak" id="spk">${SPK}</button></div>
       <div class="col" style="gap:10px" id="opts">${opts.map((o) => `<button class="choice" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div><div id="fb" class="col"></div>` + backBtn;
    document.getElementById("spk").onclick = () => say(c.w);
    wireBack();
    say(c.w);
    $main.querySelectorAll(".choice").forEach((b) => b.onclick = () => {
      const pick = b.dataset.o, ok = pick === c.m;
      $main.querySelectorAll(".choice").forEach((x) => { x.disabled = true; if (x.dataset.o === c.m) { x.classList.add("right"); x.textContent += " ✓"; } else if (x === b) x.classList.add("wrong"); });
      if (ok && !retried.has(c.w)) score++;
      document.getElementById("fb").innerHTML = `<div class="bubble ${ok ? "ok" : "no"}">${ok ? "맞았어요!" : `<b class="en">${esc(c.w)}</b> = ${esc(c.m)}${retried.has(c.w) ? "" : " · 이 단어는 끝에 한 번 더 나와요."}`}</div><button class="btn" id="nx">다음</button>`;
      const nx = document.getElementById("nx"); nx.focus();
      nx.onclick = () => {
        const cur = queue.shift();
        if (!ok && !retried.has(cur.w)) { queue.push(cur); retried.add(cur.w); } else doneN++;
        if (!queue.length) return finish("meaning", score, U.w.length);
        draw();
      };
    });
  };
  draw();
}

/* ③ 문장 만들기 (덩어리 배열) — 브릿지 라이팅과 같은 규칙으로 덩어리를 나눠요 */
const GLUE = new Set(["a","an","the","my","your","his","her","its","our","their","this","that","these","those","to","of","in","on","at","from","with","for","by","about","into","very","too","so","some","any","no","not","don't","doesn't","didn't","can't","won't","every","each","one","two","three","many","much"]);
function chunkSentence(s, max = 7) {
  const words = s.trim().split(/\s+/).filter(Boolean);
  if (words.length <= 4) return words;
  const out = []; let buf = [];
  words.forEach((w, i) => {
    const bare = w.toLowerCase().replace(/[^a-z0-9']/g, "");
    buf.push(w);
    const glue = (GLUE.has(bare) || /^\d+$/.test(bare)) && !/[,.!?]$/.test(w);
    if (i === words.length - 1 || !glue) { out.push(buf.join(" ")); buf = []; }
  });
  while (out.length > max) {
    let best = 0;
    for (let i = 1; i < out.length - 1; i++) if (out[i].length + out[i + 1].length < out[best].length + out[best + 1].length) best = i;
    out.splice(best, 2, out[best] + " " + out[best + 1]);
  }
  return out;
}
function chunk() {
  header("③ 문장 만들기");
  let queue = shuffle(U.s.map(([ko, en]) => ({ ko, en }))), retried = new Set(), score = 0, doneN = 0;
  const draw = () => {
    const c = queue[0], parts = chunkSentence(c.en), order = shuffleNotSame(parts.map((_, k) => k));
    let placed = [], result = null;
    const paint = () => {
      $main.innerHTML = progress(doneN, U.s.length, "③ 문장 만들기 · 덩어리를 눌러 문장을 만들어요") +
        `<div class="qcard" style="padding:18px"><div style="font-size:21px;font-weight:900">${esc(c.ko)}</div><button class="hint" id="hint">🔈 힌트로 듣기</button></div>
         <div class="tray">${placed.length ? placed.map((k) => `<button class="chunk on" data-p="${k}" ${result !== null ? "disabled" : ""}>${esc(parts[k])}</button>`).join("") : `<span class="small muted" style="padding:10px">아래 덩어리를 차례로 눌러요</span>`}</div>
         <div class="chunks">${order.map((k) => `<button class="chunk ${placed.includes(k) ? "used" : ""}" data-k="${k}" ${placed.includes(k) || result !== null ? "disabled" : ""}>${esc(parts[k])}</button>`).join("")}</div>
         ${result === null
          ? `<button class="btn" id="chk" ${placed.length !== parts.length ? "disabled" : ""}>확인</button>`
          : `<div class="bubble ${result ? "ok" : "no"}">${result ? `맞았어요! <span class="en">${esc(c.en)}</span>` : `정답: <b class="en">${esc(c.en)}</b>${retried.has(c.en) ? "" : " · 이 문장은 끝에 한 번 더 나와요."}`}</div><button class="btn" id="nx">다음</button>`}` + backBtn;
      document.getElementById("hint").onclick = () => say(c.en);
      $main.querySelectorAll(".chunks .chunk").forEach((b) => b.onclick = () => { placed.push(+b.dataset.k); paint(); });
      $main.querySelectorAll(".tray .chunk").forEach((b) => b.onclick = () => { placed = placed.filter((x) => x !== +b.dataset.p); paint(); });
      const chk = document.getElementById("chk");
      if (chk) chk.onclick = () => { result = placed.map((k) => parts[k]).join(" ") === parts.join(" "); if (result && !retried.has(c.en)) score++; say(c.en); paint(); };
      const nx = document.getElementById("nx");
      if (nx) { nx.focus(); nx.onclick = () => {
        const cur = queue.shift();
        if (!result && !retried.has(cur.en)) { queue.push(cur); retried.add(cur.en); } else doneN++;
        if (!queue.length) return finish("chunk", score, U.s.length);
        draw(); scrollTo(0, 0);
      }; }
      wireBack();
    };
    paint();
  };
  draw();
}

/* 결과 화면 (캡처용) */
function result() {
  const rec = load();
  header("이 화면을 캡처해서 Sookje에 올려요");
  const last = Math.max(...ACTS.map((a) => Date.parse(rec[a.key].at)));
  const d = new Date(last);
  const when = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $main.innerHTML = `<div class="res">
      <span class="stamp">Unit ${pad(unit)} 완료!</span>
      <div style="text-align:center"><div class="en" style="font-size:22px;font-weight:900">${esc(U.t)}</div><div class="small muted">${when}</div></div>
      <div class="line"><span>① 단어 플래시 카드</span><b>✓ ${rec.flash.total}개</b></div>
      <div class="line"><span>② 뜻 고르기</span><b>${rec.meaning.score} / ${rec.meaning.total}</b></div>
      <div class="line"><span>③ 문장 만들기</span><b>${rec.chunk.score} / ${rec.chunk.total}</b></div>
      <div class="small muted" style="text-align:center">점수는 처음 한 번에 맞힌 개수예요</div>
    </div>
    <div class="card small"><b>다음 할 일</b><br>1. 이 화면을 캡처해요<br>2. 몬스터 라이팅 문제집 Unit ${pad(unit)}를 풀어요<br>3. 캡처 + 문제집 사진을 Sookje에 올려요</div>
    <button class="btn ghost" id="back">처음 화면으로</button>`;
  wireBack();
  scrollTo(0, 0);
}

if (U) home(); else unitList();
